<!doctype html><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>Neon Art Gallery</title><body style="background:#0a1026;color:#fff;font:16px sans-serif"><p id=m>Loading Neon Art Gallery...</p><script>
(async()=>{const q=(location.search||"?1").slice(1);const r=await Promise.all(Array.from({length:7},(_,i)=>fetch((i<4?"v4/q":"v5/q")+i+".txt?"+q).then(x=>{if(!x.ok)throw 0;return x.text()})));
document.open();document.write(r.map(t=>t.replace(/\n$/,"")).join(""));document.close()})().catch(()=>{document.getElementById("m").textContent="Could not load. Please reload."})
</script>
